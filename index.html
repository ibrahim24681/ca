<head>

<title>Ibrahim Salah | Links</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  /* تم الإبقاء على تنسيقاتك الرائعة كما هي */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --dark: #0a0a0f;
    --card: rgba(255,255,255,0.04);
    --border: rgba(201,168,76,0.25);
  }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px 20px 60px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% -10%, rgba(201,168,76,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(201,168,76,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .avatar-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    margin-bottom: 22px;
    animation: fadeDown 0.7s ease both;
  }

  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(var(--gold), var(--gold-light), var(--gold), transparent 60%, var(--gold));
    animation: spin 6s linear infinite;
  }

  .avatar-wrap img {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--dark);
    display: block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.02em;
    color: #fff;
    animation: fadeDown 0.7s 0.1s ease both;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.12em;
    animation: fadeDown 0.7s 0.2s ease both;
    margin-bottom: 10px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px auto 30px;
    animation: fadeDown 0.7s 0.25s ease both;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    color: #fff;
    padding: 14px 20px;
    border-radius: 14px;
    text-decoration: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: background 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s;
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .link-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.07) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .link-btn:hover {
    background: rgba(201,168,76,0.1);
    border-color: rgba(201,168,76,0.6);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(201,168,76,0.15);
  }

  .link-btn:hover::after { opacity: 1; }

  .link-btn .icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.2rem;
  }

  .link-btn .label { flex: 1; text-align: right; }
  .link-btn .arrow { color: var(--gold); font-size: 0.85rem; opacity: 0.7; }

  .link-btn:nth-child(1) { animation-delay: 0.35s; }
  .link-btn:nth-child(2) { animation-delay: 0.45s; }
  .link-btn:nth-child(3) { animation-delay: 0.55s; }
  .link-btn:nth-child(4) { animation-delay: 0.65s; }
  .link-btn:nth-child(5) { animation-delay: 0.75s; }
  .link-btn:nth-child(6) { animation-delay: 0.85s; }
  .link-btn:nth-child(7) { animation-delay: 0.95s; }

  .icon-wa  { background: rgba(37,211,102,0.15);  color: #25d366; }
  .icon-tg  { background: rgba(0,136,204,0.15);   color: #229ed9; }
  .icon-fb  { background: rgba(24,119,242,0.15);  color: #1877f2; }
  .icon-ig  { background: rgba(225,48,108,0.15);  color: #e1306c; }
  .icon-gm  { background: rgba(234,67,53,0.15);   color: #ea4335; }
  .icon-tt  { background: rgba(255,255,255,0.08); color: #fff; }
  .icon-ip  { background: rgba(0,171,132,0.15);   color: #00ab84; }

  .footer {
    margin-top: 40px;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.08em;
    animation: fadeDown 0.7s 1s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
